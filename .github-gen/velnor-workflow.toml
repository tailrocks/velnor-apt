schema = 2

[generator]
repository = "tailrocks/velnor-apt"
# D19 pin: the velnor-workflow BUILD commit whose product rendered this tree.
revision = "eed474c4a1d9b071fd1b5de00c769c8997398e5a"

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"
profile = "apt-repository"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# [renovate] DEFERRED (W4 escalation): s2 `validate_renovate`
# (s2/config/mod.rs) requires the velnor provider +
# [workflow.selectors.velnor], but `enforce_visibility_policy` (s2/mod.rs)
# requires public repos to be exactly [github-hosted] and rejects a velnor
# selector — so [renovate] is unsatisfiable on public repos at this pin.
# The renderer itself is provider-agnostic (`control_plane_runner`), so the
# fix is validation-only (generator side). Re-add with [[declare]]
# renovate + renovate-validate rows once the generator admits a hosted
# writer for public repos; until then renovate.yml/renovate-validate.yml
# are absent from the tree.
# [renovate]
# enabled = true
# reason = "Scheduled dependency PRs per renovate.json. ..."

[release]
enabled = true
reason = "APT feed publisher: verify-before-mutation feed workflow for the velnor-runner Debian repository."
kind = "apt"
package = "velnor-runner"
binary = "velnor-runner"
source_repository = "tailrocks/velnor"
consumer_repository = "tailrocks/velnor-apt"
manifest_schema = "velnor.package-release.v1"
signer_fingerprint = "7E66E3A53F9B3B5CA61D0F53261EDAC957DEB801"
passphrase_secret = "APT_GPG_PASSPHRASE"
signing_key_secret = "APT_GPG_PRIVATE_KEY"
keyring_path = "velnor.gpg"
apt_origin = "Velnor"
apt_feed_url = "https://velnor-apt.tailrocks.com"
description = "apt repository for the Velnor self-hosted GitHub Actions runner"
retention = 1

[[declare]]
primitive = "release"
file = "release.yml"

[[units]]
id = "docs"
label = "Documentation"
kind = "docs"
root = "."
ci_tasks = ["check"]
# `mise run check` needs these lock pins. Without them the GitHub docs job
# sets up mise with install:false and never installs, so a lockfile bump
# cold-caches and fails actionlint 127 before ci-required can pass.
mise_tools = ["actionlint", "gh", "jq", "shellcheck"]
