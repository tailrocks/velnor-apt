[tools]
actionlint = "1.7.12"
gh = "2.98.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[bootstrap.packages]
"apt:gnupg" = "latest"
"apt:apt-utils" = "latest"

[tasks.actionlint]
run = "actionlint"

# Plan 010: lint the release-verification scripts and run their offline fixture
# tests. shellcheck catches shell defects; the fixture test proves verify-release
# accepts a coherent release and rejects every incoherent one before reprepro.
[tasks.shellcheck]
run = "shellcheck .github/scripts/*.sh"

[tasks.verify-release-test]
run = ".github/scripts/test-verify-release.sh"

[tasks.package-update]
run = "./scripts/package-update.sh"

[tasks.package-update-test]
run = "./scripts/test-package-update.sh"

# Gate contract (ci-apt.yml runs install/build/test/lint/format as separate
# steps): every gate reaches exactly one disjoint leaf set, so each leaf runs
# once per CI lane. `check` stays the depends-only human aggregate. The former
# build->check and fmt->check edges re-ran all four leaves 3x per lane.
[tasks.check]
depends = ["actionlint", "shellcheck", "verify-release-test", "package-update-test"]

# Build gate: the apt class compiles nothing in CI; the closest real
# build/verify leaf proves the release-artifact coherence chain.
[tasks.build]
depends = ["verify-release-test"]

[tasks.test]
depends = ["package-update-test"]

[tasks.lint]
depends = ["actionlint", "shellcheck"]

# Format gate: no formatter exists for this class (generated workflows,
# committed lockfiles, shell scripts). The shared ci-apt template still invokes
# `mise run fmt`, so it stays a truthful no-op instead of re-running check.
[tasks.fmt]
run = "true"

[settings]
lockfile = true
